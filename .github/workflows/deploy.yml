name: Deploy to VPS

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            mkdir -p /var/www/ecommerce
            cd /var/www/ecommerce
            
            # If the folder doesn't exist, clone it
            if [ ! -d "dubaiperfume.mayaitech.com" ]; then
              git clone https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git dubaiperfume.mayaitech.com
            fi
            
            cd dubaiperfume.mayaitech.com
            git config --global --add safe.directory /var/www/ecommerce/dubaiperfume.mayaitech.com
            
            # Update remote with current action token to prevent auth errors
            git remote set-url origin https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
            
            git fetch origin
            git checkout ${{ github.ref_name }}
            git reset --hard origin/${{ github.ref_name }}
            git clean -fd
            
            # Install Node.js dependencies and build the project
            echo "Building the React project..."
            if ! command -v npm &> /dev/null; then
              echo "Installing Node.js..."
              curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
              apt-get install -y nodejs
            fi
            npm install
            npm run build
            
            # Setup Nginx if not already configured
            NGINX_CONF="/etc/nginx/sites-available/dubaiperfume.mayaitech.com"
            if [ ! -f "$NGINX_CONF" ]; then
              echo "Creating Nginx configuration..."
              cat << 'EOF' > $NGINX_CONF
            server {
                listen 80;
                server_name dubaiperfume.mayaitech.com;
                root /var/www/ecommerce/dubaiperfume.mayaitech.com/dist;
                index index.html index.htm;

                location / {
                    try_files $uri $uri/ /index.html;
                }
            }
            EOF
              ln -sf $NGINX_CONF /etc/nginx/sites-enabled/
              nginx -t && systemctl restart nginx
              echo "Nginx configured and restarted."
            else
              # Ensure Nginx points to the dist directory and has SPA routing
              sed -i 's|root /var/www/ecommerce/ecommerce.rtsquad.com/dist;|root /var/www/ecommerce/dubaiperfume.mayaitech.com/dist;|' $NGINX_CONF
              sed -i 's|root /var/www/ecommerce/ecommerce.rtsquad.com;|root /var/www/ecommerce/dubaiperfume.mayaitech.com/dist;|' $NGINX_CONF
              sed -i 's|try_files $uri $uri/ =404;|try_files $uri $uri/ /index.html;|' $NGINX_CONF
              nginx -t && systemctl restart nginx
            fi
            
            # Setup SSL using Certbot if not already configured
            if ! grep -q "listen 443" $NGINX_CONF; then
              echo "Setting up SSL..."
              if ! command -v certbot &> /dev/null; then
                apt-get update
                apt-get install -y certbot python3-certbot-nginx
              fi
              certbot --nginx --non-interactive --agree-tos -m admin@mayaitech.com -d dubaiperfume.mayaitech.com
              echo "SSL configuration completed."
            else
              echo "SSL already configured."
            fi
